<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervantes Asociados</title>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-header">
                <span class="material-symbols-outlined" style="font-size: 3rem; color: var(--apple-blue); margin-bottom: 10px;">gavel</span>
                <h1>Cervantes Asociados</h1>
                <p>Inicia sesión con tu cuenta corporativa</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; border-radius: 12px; font-weight: 600;">
                    Continuar
                </button>
            </form>
        </div>
    </div>
    
    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
